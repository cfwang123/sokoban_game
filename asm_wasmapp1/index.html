<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Sokoban WebAssembly（教学）</title>
  <style>
    body { background:#1a1a2e; color:#ecf0f1; font-family:system-ui,sans-serif;
      display:flex; flex-direction:column; align-items:center; min-height:100vh; justify-content:center; }
    pre { font-size:22px; background:#16213e; padding:12px; border-radius:8px; line-height:1.15; }
    .hint { opacity:0.75; font-size:0.9rem; }
    button { margin:0.2rem; padding:0.4rem 0.7rem; background:#0f3460; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>Sokoban · WebAssembly</h1>
  <p class="hint">WAT 文本格式 → 浏览器编译 · WASD / 按钮 · Z 撤销 · R 重置</p>
  <pre id="board">loading…</pre>
  <p id="status"></p>
  <div>
    <button data-dx="0" data-dy="-1">W</button>
    <button data-dx="-1" data-dy="0">A</button>
    <button data-dx="0" data-dy="1">S</button>
    <button data-dx="1" data-dy="0">D</button>
    <button id="z">Z</button>
    <button id="r">R</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
