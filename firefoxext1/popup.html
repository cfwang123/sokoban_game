<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>推箱子</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <strong>推箱子</strong>
    <span id="info">…</span>
  </header>
  <div class="toolbar">
    <button type="button" id="prev" title="上一关">◀</button>
    <button type="button" id="undo" title="撤销">↩</button>
    <button type="button" id="reset" title="重置">↻</button>
    <button type="button" id="next" title="下一关">▶</button>
  </div>
  <canvas id="board" width="320" height="280" tabindex="0"></canvas>
  <p class="hint">方向键/WASD · 点空地寻路 · Z 撤销 · R 重置</p>
  <script src="js/game.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
