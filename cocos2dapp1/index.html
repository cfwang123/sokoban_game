<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sokoban Cocos2d 风格（教学）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1a1a2e; color: #ecf0f1; font-family: system-ui, sans-serif;
    }
    h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    .hint { opacity: 0.7; font-size: 0.85rem; margin-bottom: 0.75rem; }
    canvas {
      background: #0f0f1a;
      border-radius: 8px;
      image-rendering: pixelated;
    }
    #status { margin-top: 0.75rem; }
  </style>
</head>
<body>
  <h1>Sokoban · Cocos2d 风格场景（教学）</h1>
  <p class="hint">Canvas 场景循环模拟 Director/Layer；完整引擎可用 Cocos Creator 导入逻辑</p>
  <canvas id="c" width="320" height="340"></canvas>
  <p id="status"></p>
  <script src="js/game-core.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
