# NROM-256: 32KB PRG + 8KB CHR (C + asm via cc65)
SYMBOLS {
    __STACKSIZE__:  type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $0800;
}

MEMORY {
    ZP:     start = $00,    size = $100,  type = rw, file = "";
    OAM:    start = $200,   size = $100,  type = rw, file = "";
    # $0300-$06FF BSS; $0700-$07FF C software stack
    RAM:    start = $300,   size = $400,  type = rw, file = "";
    HDR:    start = $0000,  size = $10,   type = ro, file = %O, fill = yes;
    PRG:    start = $8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    CHR:    start = $0000,  size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    OAM:      load = OAM, type = bss, align = $100, optional = yes;
    BSS:      load = RAM, type = bss, define = yes;
    DATA:     load = PRG, type = rw, define = yes, run = RAM, optional = yes;
    ONCE:     load = PRG, type = ro, optional = yes;
    HEADER:   load = HDR, type = ro;
    STARTUP:  load = PRG, type = ro, optional = yes;
    CODE:     load = PRG, type = ro, align = $100;
    RODATA:   load = PRG, type = ro;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
    CHARS:    load = CHR, type = ro;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
